<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sword Duel Telefon Kumandası</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font-family:system-ui;text-align:center;padding:18px;touch-action:none}h1{font-size:25px}.panel{max-width:480px;margin:auto;background:#1e293b;padding:18px;border-radius:16px}input,select,button{font:inherit;border:0;border-radius:10px;padding:13px;margin:6px}input,select{width:90%;background:#fff;color:#111}button{background:#2563eb;color:white;font-weight:700}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.pad button{height:75px;font-size:20px;touch-action:none}.defend{background:#b45309}.attack{background:#dc2626}.hint{color:#cbd5e1;font-size:13px}</style></head>
<body><div class="panel"><h1>⚔️ SWORD DUEL KUMANDASI</h1><div id="connect-panel"><input id="room" inputmode="numeric" maxlength="6" placeholder="6 haneli oda kodu"><select id="player"><option value="1">Oyuncu 1</option><option value="2">Oyuncu 2</option></select><button id="connect">BAĞLAN</button></div><p id="status">Bağlantı bekleniyor</p><button id="motion" disabled>HAREKET SENSÖRÜNÜ AÇ</button><p class="hint">Telefonu sağa-sola ve yukarı-aşağı savurarak kılıcı hareket ettir. Sensör çalışmazsa dokunmatik kontrolleri kullan.</p><div class="pad"><span></span><button data-move="-1">◀</button><span></span><button class="defend" id="defend">SAVUN</button><button class="attack" id="attack">SALDIR</button><button data-move="1">▶</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.min.js"></script><script>
const params=new URLSearchParams(location.search);const server=params.get('server')||location.origin;let socket=null,playerNum=1,connected=false,lastBeta=null,lastGamma=null,lastSend=0,moveX=0,defending=false,attack=false;
const statusEl=document.getElementById('status');
function send(data={}){if(!connected||!socket)return;socket.emit('controller:input',{playerNum,...data});}
document.getElementById('connect').onclick=()=>{const code=document.getElementById('room').value.trim();playerNum=Number(document.getElementById('player').value);if(!/^\d{6}$/.test(code)){statusEl.textContent='6 haneli oda kodunu gir.';return;}socket=io(server,{transports:['websocket','polling']});socket.on('connect',()=>socket.emit('controller:join',{code},result=>{connected=!!result?.ok;statusEl.textContent=connected?'Bağlandı! Telefon kumandası hazır.':(result?.error||'Bağlanamadı');document.getElementById('motion').disabled=!connected;}));socket.on('connect_error',()=>statusEl.textContent='Sunucuya bağlanılamadı.');};
async function enableMotion(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw new Error('Sensör izni verilmedi');}window.addEventListener('deviceorientation',onOrientation);document.getElementById('motion').textContent='HAREKET SENSÖRÜ AÇIK';statusEl.textContent='Telefonu savurarak kılıcı hareket ettir!';}catch(e){statusEl.textContent='Sensör açılamadı: '+e.message;}}
document.getElementById('motion').onclick=enableMotion;
function onOrientation(e){if(e.beta==null||e.gamma==null)return;if(lastBeta===null){lastBeta=e.beta;lastGamma=e.gamma;return;}const db=e.beta-lastBeta,dg=e.gamma-lastGamma;lastBeta=e.beta;lastGamma=e.gamma;const now=performance.now();if(now-lastSend<24)return;lastSend=now;const x=Math.abs(dg)>0.8?Math.max(-35,Math.min(35,dg*2.8)):0;const y=Math.abs(db)>0.8?Math.max(-35,Math.min(35,db*2.8)):0;if(x||y)send({x,y});}
document.querySelectorAll('[data-move]').forEach(b=>{const v=Number(b.dataset.move);b.addEventListener('pointerdown',e=>{e.preventDefault();moveX=v;send({moveX,isMoving:true});});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{moveX=0;send({moveX:0,isMoving:false});}));});
const def=document.getElementById('defend');def.addEventListener('pointerdown',e=>{e.preventDefault();defending=true;send({isDefending:true});});['pointerup','pointercancel','pointerleave'].forEach(ev=>def.addEventListener(ev,()=>{defending=false;send({isDefending:false});}));
const atk=document.getElementById('attack');atk.addEventListener('pointerdown',e=>{e.preventDefault();attack=true;send({attack:true});});['pointerup','pointercancel','pointerleave'].forEach(ev=>atk.addEventListener(ev,()=>attack=false));
</script></body></html>
